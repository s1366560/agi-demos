[package]
name = "agistack-plugin-host"
edition.workspace = true
version.workspace = true
license.workspace = true

[dependencies]
agistack-core = { path = "../core" }
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
arc-swap.workspace = true
rhai.workspace = true
futures.workspace = true
jsonschema = { version = "0.33", default-features = false }
sha2 = "0.10"
serde_jcs = "0.1"
thiserror.workspace = true

[features]
external-wasm-v2 = ["dep:wasmtime"]

[dev-dependencies]
wat = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
base64 = "0.22"
ring = "0.17.14"
zip = { version = "4.6.1", default-features = false, features = ["deflate"] }
wasmtime = { version = "46", optional = true, default-features = false, features = ["cranelift", "runtime", "std"] }

# wasm32 (browser) needs the getrandom `wasm_js` backend feature enabled to
# satisfy rhai/ahash's `runtime-rng` at runtime (browser has Web Crypto). Paired
# with the `--cfg getrandom_backend="wasm_js"` rustflag in `.cargo/config.toml`.
# Native targets (server/desktop/iOS/Android) use the OS RNG and don't need this.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
