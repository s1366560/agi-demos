[package]
name = "memstack-cua-native-helper"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "sync", "time", "fs", "process"] }
hmac = "0.12"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
url = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
sky-cua-platform = { git = "https://github.com/becksclair/sky-cua.git", rev = "9e4d9f0baa04b001631f9c8dd73dab439988524a" }

[target.'cfg(target_os = "windows")'.dependencies]
sky-cua-windows = { git = "https://github.com/becksclair/sky-cua.git", rev = "9e4d9f0baa04b001631f9c8dd73dab439988524a" }
windows-capture = "2"
windows = { version = "0.62", features = ["Graphics_Capture", "Win32_Graphics_Gdi", "Win32_System_WinRT", "Win32_UI_HiDpi", "Security_Authorization_AppCapabilityAccess", "Win32_System_Ole", "Win32_System_Performance", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Media_Audio", "Win32_System_Threading", "Win32_System_StationsAndDesktops", "Win32_UI_Accessibility", "Win32_Foundation", "Win32_System_Memory", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_DataExchange", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Registry", "Win32_System_LibraryLoader", "ApplicationModel", "Management_Deployment", "Storage", "Storage_Search", "Data_Xml_Dom"] }

[target.'cfg(target_os = "linux")'.dependencies]
sky-cua-linux = { git = "https://github.com/becksclair/sky-cua.git", rev = "9e4d9f0baa04b001631f9c8dd73dab439988524a" }
atspi = { version = "0.29", default-features = false, features = ["tokio", "proxies", "wrappers"] }
atspi-connection = { version = "0.13", default-features = false, features = ["wrappers"] }
zbus = { version = "5", features = ["tokio"] }
gstreamer = { version = "0.25", features = ["v1_22"] }
gstreamer-app = { version = "0.25", features = ["v1_22"] }
gio = { version = "0.21", features = ["v2_58"] }
libc = "0.2"
ashpd = { version = "0.13", default-features = false, features = ["tokio", "remote_desktop", "screencast"] }
reis = "0.6"
enumflags2 = "0.7"
futures-util = "0.3"
x11rb = { version = "0.13", features = ["xinput", "xtest", "composite", "xfixes"] }
wl-clipboard-rs = "0.9"
wayland-client = "0.31"
xkbcommon = "0.9"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "memstack-cua-native-helper"
path = "src/main.rs"
