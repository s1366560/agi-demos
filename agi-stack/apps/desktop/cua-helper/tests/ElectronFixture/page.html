<!doctype html>
<meta charset="utf-8">
<title>Background input fixture</title>
<style>
  body { margin: 30px; font: 16px system-ui; }
  input { box-sizing: border-box; width: 460px; height: 30px; }
  #canvas { height: 120px; background: #eef4ff; position: relative; user-select: none; }
  #drag-status { position: absolute; bottom: 0; margin: 0; pointer-events: none; }
  #scroll { margin-top: 20px; height: 100px; overflow: auto; }
  #scroll > div { height: 1500px; background: linear-gradient(#fafafa, #dddddd); }
</style>
<p id="shift">Shift held: false</p>
<p id="mouse">Left button held: false</p>
<input aria-label="Fixture electron input">
<div id="canvas"><p id="drag-status">drag idle</p></div>
<div id="scroll"><div>Scroll fixture</div></div>
