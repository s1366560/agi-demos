appId: ai.agistack.desktop
productName: agi-stack Desktop
artifactName: agi-stack-desktop-${version}-${os}-${arch}.${ext}
asar: true
electronUpdaterCompatibility: ">=2.16"
forceCodeSigning: true
afterSign: scripts/seal-cua-after-sign.mjs
directories:
  output: release
  buildResources: build
files:
  - out/**/*
protocols:
  - name: agi-stack Desktop OAuth callback
    schemes:
      - agistack-auth
extraResources:
  - from: build/cua-repl
    to: sidecar/cua-repl
  - from: build/sidecar
    to: sidecar
    filter:
      - agistack-desktop-sidecar*
      - cua-helper*
      - Memstack Computer Use.app/**/*
      - CUA_SHA256SUMS
      - memstack-cua-cloud-connectors*
      - CUA_CONNECTORS_SHA256SUMS
      - locked-use/**/*
      - cua-plugin/skills/**/*
      - SHA256SUMS
  - from: build/workspace-core
    to: workspace-core
    filter:
      - memstack-workspace-core*
      - SHA256SUMS
  - from: electron/resources/iab-cursor.js
    to: iab/iab-cursor.js
publish:
  provider: github
  owner: s1366560
  repo: agi-demos
  releaseType: draft
  publishAutoUpdate: true
  tagNamePrefix: v
mac:
  sign: scripts/sign-cua-macos.mjs
  target:
    - dmg
    - zip
  category: public.app-category.developer-tools
  icon: electron/resources/icon.icns
  hardenedRuntime: true
  notarize: true
  entitlements: electron/resources/entitlements.mac.plist
  entitlementsInherit: electron/resources/entitlements.mac.inherit.plist
  extendInfo:
    NSAppleEventsUsageDescription: Computer Use can access supported applications only after you authorize Automation access.
    NSContactsUsageDescription: Computer Use accesses contacts only for an authorized Contacts operation.
    NSCalendarsFullAccessUsageDescription: Computer Use accesses calendars only for an authorized Calendar operation.
    NSCalendarsUsageDescription: Computer Use accesses calendars only for an authorized Calendar operation.
    NSMicrophoneUsageDescription: Voice input and voice calls use the microphone only while you are actively interacting with a conversation.
  binaries:
    - Contents/Resources/sidecar/cua-repl/bin/node
    - Contents/Resources/sidecar/agistack-desktop-sidecar
    - Contents/Resources/sidecar/memstack-cua-cloud-connectors
    - Contents/Resources/sidecar/Memstack Computer Use.app/Contents/MacOS/cua-helper
    - Contents/Resources/sidecar/Memstack Computer Use.app/Contents/Resources/locked-use/memstack-cua-guardian
    - Contents/Resources/sidecar/Memstack Computer Use.app/Contents/Resources/locked-use/memstack-cua-lock-installer
    - Contents/Resources/sidecar/Memstack Computer Use.app/Contents/Resources/locked-use/MemStackComputerUseAuthorizationPlugin.bundle/Contents/MacOS/MemStackComputerUseAuthorizationPlugin
    - Contents/Resources/workspace-core/memstack-workspace-core
win:
  target:
    - nsis
  icon: electron/resources/icon.png
  signExecutable: true
  signExts:
    - .exe
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
linux:
  target:
    - AppImage
    - deb
  category: Development
  icon: electron/resources/icon.png
deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libgstreamer1.0-0 (>= 1.22)
    - libgstreamer-plugins-base1.0-0 (>= 1.22)
    - gstreamer1.0-plugins-base
    - gstreamer1.0-plugins-good
    - gstreamer1.0-pipewire
    - libxkbcommon0
    - at-spi2-core
    - xdotool
    - x11-utils
    - pulseaudio-utils
    - xdg-desktop-portal
  recommends:
    - libappindicator3-1
    - pipewire-pulse
rpm:
  depends:
    - gtk3
    - libnotify
    - nss
    - libXScrnSaver
    - (libXtst or libXtst6)
    - xdg-utils
    - at-spi2-core
    - (libuuid or libuuid1)
    - gstreamer1 >= 1.22
    - gstreamer1-plugins-base
    - gstreamer1-plugins-good
    - pipewire-gstreamer
    - libxkbcommon
    - xdotool
    - xdpyinfo
    - xprop
    - xwininfo
    - pulseaudio-utils
    - xdg-desktop-portal
