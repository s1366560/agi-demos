{{- if .Values.api.enabled }}
{{- $standard := and .Values.api.packageKernel .Values.api.initialProject.enabled }}
{{- $writeDbConfig := true }}
{{- range .Values.api.volumeMounts }}
{{- if eq .mountPath "/app/.env" }}{{ $writeDbConfig = false }}{{ end }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "memstack.fullname" . }}-api
  labels:
    {{- include "memstack.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      {{- include "memstack.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.api.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "memstack.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: {{ include "memstack.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if or .Values.api.waitForDependencies $writeDbConfig }}
      initContainers:
        {{- if $writeDbConfig }}
        - name: database-config
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          {{- with .Values.api.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command: ["python", "-c"]
          args:
            - |
              import os, sys
              from pathlib import Path
              from sqlalchemy import URL

              env = os.environ
              url = URL.create("postgresql", username=env["POSTGRES_USER"],
                               password=env["POSTGRES_PASSWORD"], host=env["POSTGRES_HOST"],
                               port=int(env["POSTGRES_PORT"]), database=env["POSTGRES_DB"])
              value = url.render_as_string(hide_password=False)
              if any(c in value for c in "\r\n"):
                  raise ValueError("invalid database endpoint")
              os.umask(0o077)
              Path(sys.argv[1]).write_text("DATABASE_URL=" + value + "\n", encoding="utf-8")
            - /run/memstack-database/database.env
          env:
            {{- include "memstack.apiPostgresEnvironment" . | nindent 12 }}
          volumeMounts:
            - name: database-config
              mountPath: /run/memstack-database
        {{- end }}
        {{- if .Values.api.waitForDependencies }}
        {{- include "memstack.waitForPort" (dict "name" "postgres" "host" (include "memstack.postgresHost" .) "port" .Values.postgres.service.port "Values" .Values) | nindent 8 }}
        {{- include "memstack.waitForPort" (dict "name" "redis" "host" (include "memstack.redisHost" .) "port" .Values.redis.service.port "Values" .Values) | nindent 8 }}
        {{- if not .Values.api.packageKernel }}
        {{- include "memstack.waitForPort" (dict "name" "neo4j" "host" (include "memstack.neo4jHost" .) "port" .Values.neo4j.service.boltPort "Values" .Values) | nindent 8 }}
        {{- if .Values.minio.enabled }}
        {{- include "memstack.waitForPort" (dict "name" "minio" "host" (include "memstack.minioHost" .) "port" .Values.minio.service.apiPort "Values" .Values) | nindent 8 }}
        {{- end }}
        {{- end }}
        {{- end }}
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          {{- with .Values.api.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.api.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.api.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "memstack.fullname" . }}-config
            {{- with .Values.api.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "memstack.secretName" . }}
                  key: secret-key
            - name: LLM_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "memstack.secretName" . }}
                  key: llm-encryption-key
            {{- include "memstack.apiPostgresEnvironment" . | nindent 12 }}
            - name: DATABASE_URL
              value: postgresql://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):$(POSTGRES_PORT)/$(POSTGRES_DB)
            - name: REDIS_HOST
              value: {{ include "memstack.redisHost" . | quote }}
            - name: REDIS_PORT
              value: {{ .Values.redis.service.port | quote }}
            {{- if .Values.redis.auth.enabled }}
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "memstack.redisDatabaseSecretName" . }}
                  key: password
            {{- end }}
            - name: REDIS_URL
              value: {{ include "memstack.redisUrl" . | quote }}
            {{- if not .Values.api.packageKernel }}
            - name: NEO4J_URI
              value: {{ include "memstack.neo4jUri" . | quote }}
            - name: NEO4J_USER
              value: {{ .Values.neo4j.auth.username | quote }}
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "memstack.secretName" . }}
                  key: neo4j-password
            - name: AWS_REGION
              value: us-east-1
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "memstack.secretName" . }}
                  key: aws-access-key-id
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "memstack.secretName" . }}
                  key: aws-secret-access-key
            - name: S3_BUCKET_NAME
              value: {{ .Values.minio.bucket | quote }}
            - name: S3_ENDPOINT_URL
              value: {{ include "memstack.minioEndpoint" . | quote }}
            {{- range $key, $_ := .Values.secrets.providerApiKeys }}
            - name: {{ $key }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "memstack.secretName" $ }}
                  key: {{ $key }}
                  optional: true
            {{- end }}
            {{- end }}
            {{- if $standard }}
            - name: PACKAGE_KERNEL_DATABASE_MODE
              value: standalone
            - name: PACKAGE_KERNEL_BOOTSTRAP_DIRECTORY
              value: /run/memstack-initial
            - name: PLUGIN_MARKETPLACE_TRUSTED_KEY_FILES
              value: '["/run/memstack-initial/publisher.pem"]'
            - name: PLUGIN_WORKER_ALLOWED_REGISTRIES
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.initialProject.secret }}
                  key: worker-registries.json
            - name: DOCKER_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.api.initialProject.secret }}
                  key: docker-host
            {{- end }}
            {{- range $key, $value := .Values.api.extraEnv }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- if or $standard $writeDbConfig .Values.api.volumeMounts }}
          volumeMounts:
            {{- if $standard }}
            - name: initial-archives
              mountPath: /run/memstack-initial/archives
              readOnly: true
            - name: initial-policy
              mountPath: /run/memstack-initial/selection.json
              subPath: selection.json
              readOnly: true
            {{- range $file := list "owner.json" "publisher.pem" }}
            - name: initial-identity
              mountPath: /run/memstack-initial/{{ $file }}
              subPath: {{ $file }}
              readOnly: true
            {{- end }}
            {{- end }}
            {{- if $writeDbConfig }}
            - name: database-config
              mountPath: /app/.env
              subPath: database.env
              readOnly: true
            {{- end }}
            {{- with .Values.api.volumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
          {{- with .Values.api.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- if or $standard $writeDbConfig .Values.api.volumes }}
      volumes:
        {{- if $standard }}
        - name: initial-archives
          persistentVolumeClaim:
            claimName: {{ .Values.api.initialProject.archiveClaim }}
            readOnly: true
        - name: initial-policy
          configMap:
            name: {{ include "memstack.fullname" . }}-initial-packages
        - name: initial-identity
          secret:
            secretName: {{ .Values.api.initialProject.secret }}
        {{- end }}
        {{- if $writeDbConfig }}
        - name: database-config
          emptyDir:
            medium: Memory
        {{- end }}
        {{- with .Values.api.volumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "memstack.fullname" . }}-api
  labels:
    {{- include "memstack.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.api.service.type }}
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "memstack.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api
{{- if .Values.api.pdb.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "memstack.fullname" . }}-api
  labels:
    {{- include "memstack.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  {{- with .Values.api.pdb.minAvailable }}
  minAvailable: {{ . }}
  {{- end }}
  {{- with .Values.api.pdb.maxUnavailable }}
  maxUnavailable: {{ . }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "memstack.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: api
{{- end }}
{{- end }}
