name: Desktop Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

env:
  AGISTACK_RELEASE_VERSION: '0.1.0'

jobs:
  authorize:
    name: Authorize protected desktop release tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Authorize immutable release identity
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          DESKTOP_RELEASE_ALLOWED_ACTORS: ${{ vars.DESKTOP_RELEASE_ALLOWED_ACTORS }}
          GITHUB_REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            echo "Desktop releases require a tag ref" >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_PROTECTED" != "true" ]]; then
            echo "Desktop release tag must be protected" >&2
            exit 1
          fi
          node <<'NODE'
          const raw = process.env.DESKTOP_RELEASE_ALLOWED_ACTORS ?? '';
          const actors = raw
            .split(/[,\n]/)
            .map((actor) => actor.trim())
            .filter(Boolean);
          if (
            actors.length === 0 ||
            new Set(actors).size !== actors.length ||
            actors.some(
              (actor) =>
                !/^[A-Za-z0-9](?:[A-Za-z0-9-]{0,37}[A-Za-z0-9])?$/.test(actor),
            )
          ) {
            throw new Error(
              'DESKTOP_RELEASE_ALLOWED_ACTORS must be a unique comma/newline-delimited actor set',
            );
          }
          if (!actors.includes(process.env.GITHUB_ACTOR)) {
            throw new Error('release actor is not in DESKTOP_RELEASE_ALLOWED_ACTORS');
          }
          NODE

          expected_tag="v${AGISTACK_RELEASE_VERSION}"
          if [[ "$GITHUB_REF_NAME" != "$expected_tag" ]]; then
            echo "Release tag must exactly match $expected_tag" >&2
            exit 1
          fi
          resolved_tag_commit="$(
            gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_REF_NAME}" --jq '.sha'
          )"
          if [[ "$resolved_tag_commit" != "$GITHUB_SHA" ]]; then
            echo "Tag does not resolve to the workflow commit" >&2
            exit 1
          fi
          comparison_status="$(
            gh api "repos/${GITHUB_REPOSITORY}/compare/${GITHUB_SHA}...main" --jq '.status'
          )"
          if [[ "$comparison_status" != "ahead" && "$comparison_status" != "identical" ]]; then
            echo "Tag commit must be an ancestor of origin/main" >&2
            exit 1
          fi

          authorized_package="$RUNNER_TEMP/authorized-desktop-package.json"
          gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/contents/agi-stack/apps/desktop/package.json?ref=${GITHUB_SHA}" \
            --jq '.content' | tr -d '\n' | base64 --decode > "$authorized_package"
          AUTHORIZED_PACKAGE="$authorized_package" node <<'NODE'
          const { readFileSync } = require('node:fs');
          const packageJson = JSON.parse(
            readFileSync(process.env.AUTHORIZED_PACKAGE, 'utf8'),
          );
          const expectedVersion = process.env.AGISTACK_RELEASE_VERSION;
          if (packageJson.version !== expectedVersion) {
            throw new Error(
              `authorized desktop package version must be ${expectedVersion}; ` +
                `found ${packageJson.version}`,
            );
          }
          if (process.env.GITHUB_REF_NAME !== `v${packageJson.version}`) {
            throw new Error('release tag must exactly match the authorized package version');
          }
          NODE

  parity-preflight:
    name: Desktop parity preflight
    needs: authorize
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.15.1

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: agi-stack/apps/desktop/pnpm-lock.yaml

      - name: Validate fixed release version and tag
        shell: node {0}
        working-directory: agi-stack/apps/desktop
        run: |
          const packageJson = require('./package.json');
          const expectedVersion = process.env.AGISTACK_RELEASE_VERSION;
          if (packageJson.version !== expectedVersion) {
            throw new Error(
              `desktop package version must remain ${expectedVersion}; found ${packageJson.version}`,
            );
          }
          const expectedTag = `v${expectedVersion}`;
          if (process.env.GITHUB_REF_NAME !== expectedTag) {
            throw new Error(`release tag must exactly match ${expectedTag}`);
          }

      - name: Install desktop dependencies
        working-directory: agi-stack/apps/desktop
        run: corepack pnpm install --frozen-lockfile

      - name: Install parity browser
        working-directory: agi-stack/apps/desktop
        run: corepack pnpm exec playwright install --with-deps chromium

      - name: Run desktop parity preflight
        run: make -C agi-stack desktop-parity-check

      - name: Upload paired renderer evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-paired-renderer-evidence
          path: agi-stack/apps/desktop/browser-qa/paired-results
          if-no-files-found: error
          retention-days: 90

  build:
    name: Build ${{ matrix.platform }}
    needs: [authorize, parity-preflight]
    runs-on: ${{ matrix.os }}
    environment: desktop-release-signing
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-latest
            builder-args: --mac --universal
          - platform: Windows
            os: windows-latest
            builder-args: --win
          - platform: Linux
            os: ubuntu-latest
            builder-args: --linux
    defaults:
      run:
        working-directory: agi-stack/apps/desktop

    steps:
      - name: Validate macOS signing and notarization credentials
        if: runner.os == 'macOS'
        shell: node {0}
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          const required = [
            'MAC_CSC_LINK',
            'MAC_CSC_KEY_PASSWORD',
            'APPLE_API_KEY_BASE64',
            'APPLE_API_KEY_ID',
            'APPLE_API_ISSUER',
            'APPLE_TEAM_ID',
          ];
          const missing = required.filter((name) => !process.env[name]);
          if (missing.length) throw new Error(`missing release secrets: ${missing.join(', ')}`);
          if (!/^[A-Z0-9]{10}$/.test(process.env.APPLE_TEAM_ID)) {
            throw new Error('APPLE_TEAM_ID must be a 10-character team identifier');
          }

      - name: Validate Windows signing credentials
        if: runner.os == 'Windows'
        shell: node {0}
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          WIN_CSC_SHA1: ${{ secrets.WIN_CSC_SHA1 }}
        run: |
          const required = ['WIN_CSC_LINK', 'WIN_CSC_KEY_PASSWORD', 'WIN_CSC_SHA1'];
          const missing = required.filter((name) => !process.env[name]);
          if (missing.length) throw new Error(`missing release secrets: ${missing.join(', ')}`);
          const thumbprint = process.env.WIN_CSC_SHA1.replace(/\s/g, '').toUpperCase();
          if (!/^[A-F0-9]{40}$/.test(thumbprint)) {
            throw new Error('WIN_CSC_SHA1 must be a 40-character certificate thumbprint');
          }

      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.15.1

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: agi-stack/apps/desktop/pnpm-lock.yaml

      - name: Validate release tag
        shell: node {0}
        run: |
          const packageJson = require('./package.json');
          const expectedVersion = process.env.AGISTACK_RELEASE_VERSION;
          if (packageJson.version !== expectedVersion) {
            throw new Error(
              `desktop package version must remain ${expectedVersion}; found ${packageJson.version}`,
            );
          }
          const expectedTag = `v${expectedVersion}`;
          if (process.env.GITHUB_REF_NAME !== expectedTag) {
            throw new Error(`release tag must exactly match ${expectedTag}`);
          }

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Test native Rust sidecar
        run: cargo test --manifest-path ../../Cargo.toml -p agistack-desktop-sidecar

      - name: Build Electron application
        run: corepack pnpm run build:electron

      - name: Build native Rust sidecar
        if: runner.os != 'macOS'
        run: cargo build --manifest-path ../../Cargo.toml -p agistack-desktop-sidecar --release

      - name: Build universal macOS Rust sidecar
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          cargo build \
            --manifest-path ../../Cargo.toml \
            -p agistack-desktop-sidecar \
            --release \
            --target x86_64-apple-darwin
          cargo build \
            --manifest-path ../../Cargo.toml \
            -p agistack-desktop-sidecar \
            --release \
            --target aarch64-apple-darwin
          mkdir -p ../../target/release
          lipo -create \
            ../../target/x86_64-apple-darwin/release/agistack-desktop-sidecar \
            ../../target/aarch64-apple-darwin/release/agistack-desktop-sidecar \
            -output ../../target/release/agistack-desktop-sidecar
          chmod 755 ../../target/release/agistack-desktop-sidecar

      - name: Stage native sidecar
        run: corepack pnpm run stage:sidecar

      - name: Build native Workspace Core
        if: runner.os != 'macOS'
        run: corepack pnpm run build:workspace-core

      - name: Build universal macOS Workspace Core
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          ../../../scripts/avernet-bcs/cargo.sh --version
          RUSTUP_HOME="$PWD/../../../.cache/avernet-bcs/rustup" \
            CARGO_HOME="$PWD/../../../.cache/avernet-bcs/cargo" \
            rustup target add \
              --toolchain 1.91.1 \
              x86_64-apple-darwin \
              aarch64-apple-darwin
          ../../../scripts/avernet-bcs/cargo.sh build \
            -p memstack-workspace-core \
            --bin memstack-workspace-core \
            --locked \
            --release \
            --target x86_64-apple-darwin
          ../../../scripts/avernet-bcs/cargo.sh build \
            -p memstack-workspace-core \
            --bin memstack-workspace-core \
            --locked \
            --release \
            --target aarch64-apple-darwin
          mkdir -p ../../../.cache/avernet-bcs/target/release
          lipo -create \
            ../../../.cache/avernet-bcs/target/x86_64-apple-darwin/release/memstack-workspace-core \
            ../../../.cache/avernet-bcs/target/aarch64-apple-darwin/release/memstack-workspace-core \
            -output ../../../.cache/avernet-bcs/target/release/memstack-workspace-core
          chmod 755 ../../../.cache/avernet-bcs/target/release/memstack-workspace-core

      - name: Stage Workspace Core helper
        run: corepack pnpm run stage:workspace-core

      - name: Materialize App Store Connect API key
        if: runner.os == 'macOS'
        shell: node {0}
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          const { appendFileSync, chmodSync, writeFileSync } = require('node:fs');
          const { join } = require('node:path');
          const keyPath = join(
            process.env.RUNNER_TEMP,
            `AuthKey_${process.env.APPLE_API_KEY_ID}.p8`,
          );
          const key = Buffer.from(process.env.APPLE_API_KEY_BASE64, 'base64');
          if (!key.toString('utf8').includes('-----BEGIN PRIVATE KEY-----')) {
            throw new Error('APPLE_API_KEY_BASE64 is not a valid private key');
          }
          writeFileSync(keyPath, key, { mode: 0o600 });
          chmodSync(keyPath, 0o600);
          appendFileSync(process.env.GITHUB_ENV, `APPLE_API_KEY=${keyPath}\n`, {
            encoding: 'utf8',
          });

      - name: Build macOS release artifacts
        if: runner.os == 'macOS'
        run: corepack pnpm exec electron-builder ${{ matrix.builder-args }} --publish never
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Notarize and staple macOS disk image
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmg_files=(release/*.dmg)
          if (( ${#dmg_files[@]} != 1 )); then
            echo "Expected exactly one macOS disk image; found ${#dmg_files[@]}" >&2
            exit 1
          fi
          xcrun notarytool submit "${dmg_files[0]}" \
            --key "$APPLE_API_KEY" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "${dmg_files[0]}"
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - name: Build Windows release artifacts
        if: runner.os == 'Windows'
        run: corepack pnpm exec electron-builder ${{ matrix.builder-args }} --publish never
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Build Linux release artifacts
        if: runner.os == 'Linux'
        run: corepack pnpm exec electron-builder ${{ matrix.builder-args }} --publish never

      - name: Verify package identity, installer digests, and blockmap_structure_and_coverage_only
        run: node scripts/verify-release-artifacts.mjs
        env:
          AGISTACK_EXPECTED_VERSION: ${{ env.AGISTACK_RELEASE_VERSION }}
          AGISTACK_EXPECTED_TAG: ${{ github.ref_name }}
          AGISTACK_EXPECTED_MAC_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          AGISTACK_REQUIRE_NOTARIZATION: ${{ runner.os == 'macOS' && '1' || '0' }}
          AGISTACK_RELEASE_COMMIT_SHA: ${{ github.sha }}
          AGISTACK_RELEASE_RUN_ID: ${{ github.run_id }}
          AGISTACK_RELEASE_RUN_ATTEMPT: ${{ github.run_attempt }}
          AGISTACK_RELEASE_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WIN_CSC_SHA1: ${{ secrets.WIN_CSC_SHA1 }}

      - name: Remove App Store Connect API key
        if: always() && runner.os == 'macOS'
        shell: node {0}
        run: |
          const { existsSync, realpathSync, rmSync } = require('node:fs');
          const { dirname, resolve } = require('node:path');
          const keyPath = process.env.APPLE_API_KEY;
          if (!keyPath || !existsSync(keyPath)) process.exit(0);
          const resolvedKey = realpathSync(keyPath);
          const resolvedTemp = realpathSync(process.env.RUNNER_TEMP);
          if (dirname(resolvedKey) !== resolvedTemp) {
            throw new Error('refusing to remove an App Store key outside RUNNER_TEMP');
          }
          rmSync(resolve(resolvedKey), { force: true });

      - name: Upload verified workflow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agistack-desktop-${{ runner.os }}
          path: |
            agi-stack/apps/desktop/release/*.dmg
            agi-stack/apps/desktop/release/*.zip
            agi-stack/apps/desktop/release/*.exe
            agi-stack/apps/desktop/release/*.AppImage
            agi-stack/apps/desktop/release/*.deb
            agi-stack/apps/desktop/release/*.blockmap
            agi-stack/apps/desktop/release/latest*.yml
            agi-stack/apps/desktop/release/release-evidence-*.json
          if-no-files-found: error

  stage-draft:
    name: Stage verified desktop release draft
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: desktop-release-draft-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout immutable draft validator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download verified macOS artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: agistack-desktop-macOS
          path: verified/macos

      - name: Download verified Windows artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: agistack-desktop-Windows
          path: verified/windows

      - name: Download verified Linux artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: agistack-desktop-Linux
          path: verified/linux

      - name: Validate the combined release asset set
        run: node agi-stack/apps/desktop/scripts/release-draft-validation.mjs validate-combined

      - name: Create or recover the verified draft release
        shell: bash
        run: |
          set -euo pipefail
          assert_exact_draft() {
            local release_json is_draft release_tag
            release_json="$(
              gh release view "$GITHUB_REF_NAME" \
                --repo "$GITHUB_REPOSITORY" \
                --json isDraft,tagName
            )"
            is_draft="$(jq -r '.isDraft' <<<"$release_json")"
            release_tag="$(jq -r '.tagName' <<<"$release_json")"
            if [[ "$is_draft" != "true" || "$release_tag" != "$GITHUB_REF_NAME" ]]; then
              echo "Release must remain a draft for the exact tag" >&2
              exit 1
            fi
          }
          release_exists_fail_closed() {
            local response_path error_path
            response_path="$RUNNER_TEMP/release-before-create.json"
            error_path="$RUNNER_TEMP/release-before-create.error"
            if gh api \
              "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" \
              >"$response_path" 2>"$error_path"; then
              return 0
            fi
            if grep -Fq '(HTTP 404)' "$error_path"; then
              return 1
            fi
            cat "$error_path" >&2
            echo "Unable to determine whether the release already exists" >&2
            exit 1
          }
          resolved_tag_commit="$(
            gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_REF_NAME}" --jq '.sha'
          )"
          if [[ "$resolved_tag_commit" != "$GITHUB_SHA" ]]; then
            echo "Tag $GITHUB_REF_NAME resolves to $resolved_tag_commit, not $GITHUB_SHA" >&2
            exit 1
          fi

          if release_exists_fail_closed; then
            assert_exact_draft
          else
            if release_exists_fail_closed; then
              echo "Release appeared before draft creation; refusing to mutate" >&2
              exit 1
            fi
            resolved_tag_commit="$(
              gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_REF_NAME}" --jq '.sha'
            )"
            if [[ "$resolved_tag_commit" != "$GITHUB_SHA" ]]; then
              echo "Tag changed before draft creation" >&2
              exit 1
            fi
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --verify-tag \
              --generate-notes \
              --title "agi-stack Desktop $GITHUB_REF_NAME"
            assert_exact_draft
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify and reuse exact draft assets before upload
        shell: bash
        run: |
          set -euo pipefail
          assert_exact_draft() {
            local release_json is_draft release_tag
            release_json="$(
              gh release view "$GITHUB_REF_NAME" \
                --repo "$GITHUB_REPOSITORY" \
                --json isDraft,tagName
            )"
            is_draft="$(jq -r '.isDraft' <<<"$release_json")"
            release_tag="$(jq -r '.tagName' <<<"$release_json")"
            if [[ "$is_draft" != "true" || "$release_tag" != "$GITHUB_REF_NAME" ]]; then
              echo "Release must remain a draft for the exact tag" >&2
              exit 1
            fi
          }
          verify_downloaded_assets() {
            node agi-stack/apps/desktop/scripts/release-draft-validation.mjs \
              verify-remote "$1" "$2"
          }

          assert_exact_draft
          existing_dir="$(mktemp -d "$RUNNER_TEMP/desktop-release-existing.XXXXXX")"
          trap 'rm -rf -- "$existing_dir"' EXIT
          existing_count="$(
            gh release view "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --json assets \
              --jq '.assets | length'
          )"
          if [[ "$existing_count" != "0" ]]; then
            gh release download "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --dir "$existing_dir"
          fi
          assert_exact_draft
          verify_downloaded_assets subset "$existing_dir"

          mapfile -t missing_paths < <(
            node agi-stack/apps/desktop/scripts/release-draft-validation.mjs \
              list-missing "$existing_dir"
          )
          for asset_path in "${missing_paths[@]}"; do
            assert_exact_draft
            gh release upload "$GITHUB_REF_NAME" "$asset_path" \
              --repo "$GITHUB_REPOSITORY"
            assert_exact_draft
          done
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download and verify the exact remote asset bytes
        shell: bash
        run: |
          set -euo pipefail
          assert_exact_draft() {
            local release_json is_draft release_tag
            release_json="$(
              gh release view "$GITHUB_REF_NAME" \
                --repo "$GITHUB_REPOSITORY" \
                --json isDraft,tagName
            )"
            is_draft="$(jq -r '.isDraft' <<<"$release_json")"
            release_tag="$(jq -r '.tagName' <<<"$release_json")"
            if [[ "$is_draft" != "true" || "$release_tag" != "$GITHUB_REF_NAME" ]]; then
              echo "Release must remain a draft for the exact tag" >&2
              exit 1
            fi
          }

          assert_exact_draft
          remote_dir="$(mktemp -d "$RUNNER_TEMP/desktop-release-remote.XXXXXX")"
          trap 'rm -rf -- "$remote_dir"' EXIT
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --dir "$remote_dir"
          assert_exact_draft
          node agi-stack/apps/desktop/scripts/release-draft-validation.mjs \
            verify-remote exact "$remote_dir"
          assert_exact_draft
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Assert the release remains a draft
        shell: bash
        run: |
          set -euo pipefail
          release_json="$(
            gh release view "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --json isDraft,tagName
          )"
          is_draft="$(jq -r '.isDraft' <<<"$release_json")"
          release_tag="$(jq -r '.tagName' <<<"$release_json")"
          if [[ "$is_draft" != "true" || "$release_tag" != "$GITHUB_REF_NAME" ]]; then
            echo "Release must remain a draft for the exact tag" >&2
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}
