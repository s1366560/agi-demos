name: Desktop Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

env:
  AGISTACK_RELEASE_VERSION: '0.1.0'

jobs:
  parity-preflight:
    name: Desktop parity preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.24.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: agi-stack/apps/desktop/pnpm-lock.yaml

      - name: Validate fixed release version and tag
        shell: node {0}
        working-directory: agi-stack/apps/desktop
        run: |
          const packageJson = require('./package.json');
          const expectedVersion = process.env.AGISTACK_RELEASE_VERSION;
          if (packageJson.version !== expectedVersion) {
            throw new Error(
              `desktop package version must remain ${expectedVersion}; found ${packageJson.version}`,
            );
          }
          const expectedTag = `v${expectedVersion}`;
          if (process.env.GITHUB_REF_NAME !== expectedTag) {
            throw new Error(`release tag must exactly match ${expectedTag}`);
          }

      - name: Install desktop dependencies
        working-directory: agi-stack/apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Install parity browser
        working-directory: agi-stack/apps/desktop
        run: pnpm exec playwright install --with-deps chromium

      - name: Run desktop parity preflight
        run: make -C agi-stack desktop-parity-check

  build:
    name: Build ${{ matrix.platform }}
    needs: parity-preflight
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
            os: macos-latest
            builder-args: --mac --universal
          - platform: Windows
            os: windows-latest
            builder-args: --win
          - platform: Linux
            os: ubuntu-latest
            builder-args: --linux
    defaults:
      run:
        working-directory: agi-stack/apps/desktop

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 10.24.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: agi-stack/apps/desktop/pnpm-lock.yaml

      - name: Validate release tag
        shell: node {0}
        run: |
          const packageJson = require('./package.json');
          const expectedVersion = process.env.AGISTACK_RELEASE_VERSION;
          if (packageJson.version !== expectedVersion) {
            throw new Error(
              `desktop package version must remain ${expectedVersion}; found ${packageJson.version}`,
            );
          }
          const expectedTag = `v${expectedVersion}`;
          if (process.env.GITHUB_REF_NAME !== expectedTag) {
            throw new Error(`release tag must exactly match ${expectedTag}`);
          }

      - name: Validate macOS signing and notarization credentials
        if: runner.os == 'macOS'
        shell: node {0}
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          const required = [
            'MAC_CSC_LINK',
            'MAC_CSC_KEY_PASSWORD',
            'APPLE_API_KEY_BASE64',
            'APPLE_API_KEY_ID',
            'APPLE_API_ISSUER',
            'APPLE_TEAM_ID',
          ];
          const missing = required.filter((name) => !process.env[name]);
          if (missing.length) throw new Error(`missing release secrets: ${missing.join(', ')}`);
          if (!/^[A-Z0-9]{10}$/.test(process.env.APPLE_TEAM_ID)) {
            throw new Error('APPLE_TEAM_ID must be a 10-character team identifier');
          }

      - name: Validate Windows signing credentials
        if: runner.os == 'Windows'
        shell: node {0}
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          WIN_CSC_SHA1: ${{ secrets.WIN_CSC_SHA1 }}
        run: |
          const required = ['WIN_CSC_LINK', 'WIN_CSC_KEY_PASSWORD', 'WIN_CSC_SHA1'];
          const missing = required.filter((name) => !process.env[name]);
          if (missing.length) throw new Error(`missing release secrets: ${missing.join(', ')}`);
          const thumbprint = process.env.WIN_CSC_SHA1.replace(/\s/g, '').toUpperCase();
          if (!/^[A-F0-9]{40}$/.test(thumbprint)) {
            throw new Error('WIN_CSC_SHA1 must be a 40-character certificate thumbprint');
          }

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Electron application
        run: pnpm run build:electron

      - name: Build native Rust sidecar
        if: runner.os != 'macOS'
        run: cargo build --manifest-path ../../Cargo.toml -p agistack-desktop-sidecar --release

      - name: Build universal macOS Rust sidecar
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          cargo build \
            --manifest-path ../../Cargo.toml \
            -p agistack-desktop-sidecar \
            --release \
            --target x86_64-apple-darwin
          cargo build \
            --manifest-path ../../Cargo.toml \
            -p agistack-desktop-sidecar \
            --release \
            --target aarch64-apple-darwin
          mkdir -p ../../target/release
          lipo -create \
            ../../target/x86_64-apple-darwin/release/agistack-desktop-sidecar \
            ../../target/aarch64-apple-darwin/release/agistack-desktop-sidecar \
            -output ../../target/release/agistack-desktop-sidecar
          chmod 755 ../../target/release/agistack-desktop-sidecar

      - name: Stage native sidecar
        run: pnpm run stage:sidecar

      - name: Materialize App Store Connect API key
        if: runner.os == 'macOS'
        shell: node {0}
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          const { appendFileSync, chmodSync, writeFileSync } = require('node:fs');
          const { join } = require('node:path');
          const keyPath = join(
            process.env.RUNNER_TEMP,
            `AuthKey_${process.env.APPLE_API_KEY_ID}.p8`,
          );
          const key = Buffer.from(process.env.APPLE_API_KEY_BASE64, 'base64');
          if (!key.toString('utf8').includes('-----BEGIN PRIVATE KEY-----')) {
            throw new Error('APPLE_API_KEY_BASE64 is not a valid private key');
          }
          writeFileSync(keyPath, key, { mode: 0o600 });
          chmodSync(keyPath, 0o600);
          appendFileSync(process.env.GITHUB_ENV, `APPLE_API_KEY=${keyPath}\n`, {
            encoding: 'utf8',
          });

      - name: Build macOS release artifacts
        if: runner.os == 'macOS'
        run: pnpm exec electron-builder ${{ matrix.builder-args }} --publish never
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Notarize and staple macOS disk image
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmg_files=(release/*.dmg)
          if (( ${#dmg_files[@]} != 1 )); then
            echo "Expected exactly one macOS disk image; found ${#dmg_files[@]}" >&2
            exit 1
          fi
          xcrun notarytool submit "${dmg_files[0]}" \
            --key "$APPLE_API_KEY" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER" \
            --wait
          xcrun stapler staple "${dmg_files[0]}"
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - name: Build Windows release artifacts
        if: runner.os == 'Windows'
        run: pnpm exec electron-builder ${{ matrix.builder-args }} --publish never
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Build Linux release artifacts
        if: runner.os == 'Linux'
        run: pnpm exec electron-builder ${{ matrix.builder-args }} --publish never

      - name: Verify packaged signatures, update metadata, and sidecar integrity
        run: node scripts/verify-release-artifacts.mjs
        env:
          AGISTACK_EXPECTED_VERSION: ${{ env.AGISTACK_RELEASE_VERSION }}
          AGISTACK_EXPECTED_TAG: ${{ github.ref_name }}
          AGISTACK_EXPECTED_MAC_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          AGISTACK_REQUIRE_NOTARIZATION: ${{ runner.os == 'macOS' && '1' || '0' }}
          AGISTACK_RELEASE_COMMIT_SHA: ${{ github.sha }}
          AGISTACK_RELEASE_RUN_ID: ${{ github.run_id }}
          AGISTACK_RELEASE_RUN_ATTEMPT: ${{ github.run_attempt }}
          AGISTACK_RELEASE_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          WIN_CSC_SHA1: ${{ secrets.WIN_CSC_SHA1 }}

      - name: Remove App Store Connect API key
        if: always() && runner.os == 'macOS'
        shell: node {0}
        run: |
          const { existsSync, realpathSync, rmSync } = require('node:fs');
          const { dirname, resolve } = require('node:path');
          const keyPath = process.env.APPLE_API_KEY;
          if (!keyPath || !existsSync(keyPath)) process.exit(0);
          const resolvedKey = realpathSync(keyPath);
          const resolvedTemp = realpathSync(process.env.RUNNER_TEMP);
          if (dirname(resolvedKey) !== resolvedTemp) {
            throw new Error('refusing to remove an App Store key outside RUNNER_TEMP');
          }
          rmSync(resolve(resolvedKey), { force: true });

      - name: Upload verified workflow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agistack-desktop-${{ runner.os }}
          path: |
            agi-stack/apps/desktop/release/*.dmg
            agi-stack/apps/desktop/release/*.zip
            agi-stack/apps/desktop/release/*.exe
            agi-stack/apps/desktop/release/*.AppImage
            agi-stack/apps/desktop/release/*.deb
            agi-stack/apps/desktop/release/*.blockmap
            agi-stack/apps/desktop/release/latest*.yml
            agi-stack/apps/desktop/release/release-evidence-*.json
          if-no-files-found: error

  publish:
    name: Publish verified desktop release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download verified macOS artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: agistack-desktop-macOS
          path: verified/macos

      - name: Download verified Windows artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: agistack-desktop-Windows
          path: verified/windows

      - name: Download verified Linux artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: agistack-desktop-Linux
          path: verified/linux

      - name: Validate the combined release asset set
        shell: node {0}
        run: |
          const { createHash } = require('node:crypto');
          const { readFileSync, readdirSync, statSync, writeFileSync } = require('node:fs');
          const { basename, join } = require('node:path');
          const policies = {
            macos: {
              evidence: 'release-evidence-macos.json',
              required: [/\.dmg$/, /\.zip$/, /\.zip\.blockmap$/, /^latest-mac\.yml$/],
            },
            windows: {
              evidence: 'release-evidence-windows.json',
              required: [/\.exe$/, /\.exe\.blockmap$/, /^latest\.yml$/],
            },
            linux: {
              evidence: 'release-evidence-linux.json',
              required: [/\.AppImage$/, /\.deb$/, /^latest-linux\.yml$/],
            },
          };
          const allowed = [
            /\.dmg$/,
            /\.zip$/,
            /\.exe$/,
            /\.AppImage$/,
            /\.deb$/,
            /\.blockmap$/,
            /^latest(?:-mac|-linux)?\.yml$/,
            /^release-evidence-(?:macos|windows|linux)\.json$/,
          ];
          const isRecord = (value) =>
            value !== null && typeof value === 'object' && !Array.isArray(value);
          const sha512 = (path) =>
            createHash('sha512').update(readFileSync(path)).digest('base64');
          const assertTrueFields = (value, fields, platform) => {
            for (const field of fields) {
              if (value[field] !== true) {
                throw new Error(`${platform} native evidence ${field} must be true`);
              }
            }
          };
          const assertSidecarDigest = (value, platform) => {
            if (!/^[a-f0-9]{64}$/.test(value.sidecar_sha256 ?? '')) {
              throw new Error(`${platform} sidecar SHA-256 evidence is invalid`);
            }
          };
          const validateNativeEvidence = (platform, native) => {
            if (!isRecord(native)) {
              throw new Error(`${platform} native verification evidence is invalid`);
            }
            assertSidecarDigest(native, platform);
            if (platform === 'macos') {
              const expectedArchitectures = JSON.stringify(['arm64', 'x86_64']);
              if (
                native.architecture !== 'universal' ||
                JSON.stringify(native.app_architectures) !== expectedArchitectures ||
                JSON.stringify(native.sidecar_architectures) !== expectedArchitectures
              ) {
                throw new Error('macOS app and sidecar must both be universal');
              }
              if (
                !/^[A-Z0-9]{10}$/.test(process.env.APPLE_TEAM_ID ?? '') ||
                native.team_identifier !== process.env.APPLE_TEAM_ID ||
                !/^[a-f0-9]{64}$/.test(native.signing_certificate_sha256 ?? '') ||
                !/^Developer ID Application:\s+\S/.test(
                  native.developer_id_authority ?? '',
                )
              ) {
                throw new Error('macOS release identity evidence does not match');
              }
              assertTrueFields(
                native,
                [
                  'same_signature_identity',
                  'app_signature_valid',
                  'sidecar_signature_valid',
                  'notarization_verified',
                  'app_stapler_valid',
                  'dmg_stapler_valid',
                  'app_spctl_valid',
                  'dmg_spctl_valid',
                ],
                platform,
              );
              return;
            }
            if (platform === 'windows') {
              const expectedThumbprint = (process.env.WIN_CSC_SHA1 ?? '')
                .replace(/\s/g, '')
                .toUpperCase();
              if (
                !/^[A-F0-9]{40}$/.test(expectedThumbprint) ||
                native.signer_thumbprint !== expectedThumbprint ||
                !['x64', 'arm64'].includes(native.architecture)
              ) {
                throw new Error('Windows Authenticode identity evidence does not match');
              }
              assertTrueFields(
                native,
                ['installer_authenticode_valid', 'sidecar_authenticode_valid'],
                platform,
              );
              return;
            }
            if (
              !['x64', 'arm64'].includes(native.architecture) ||
              (native.architecture === 'x64'
                ? native.deb_architecture !== 'amd64'
                : native.deb_architecture !== 'arm64')
            ) {
              throw new Error('Linux package architecture evidence does not match');
            }
            assertTrueFields(
              native,
              [
                'sidecar_executable',
                'package_sidecars_identical',
                'appimage_executable',
                'appimage_extract_smoke',
                'deb_extract_smoke',
              ],
              platform,
            );
            for (const field of ['appimage_desktop_entry', 'deb_desktop_entry']) {
              const name = native[field];
              if (
                typeof name !== 'string' ||
                basename(name) !== name ||
                !name.endsWith('.desktop')
              ) {
                throw new Error(`Linux ${field} evidence is invalid`);
              }
            }
          };
          const assets = [];
          const owners = new Map();
          for (const [platform, policy] of Object.entries(policies)) {
            const directory = join('verified', platform);
            const names = readdirSync(directory)
              .filter((name) => statSync(join(directory, name)).isFile())
              .sort();
            if (names.length === 0) throw new Error(`no verified ${platform} assets`);
            for (const name of names) {
              if (basename(name) !== name || !allowed.some((pattern) => pattern.test(name))) {
                throw new Error(`unexpected ${platform} release asset: ${name}`);
              }
              const priorOwner = owners.get(name);
              if (priorOwner) {
                throw new Error(
                  `release asset basename collision: ${name} (${priorOwner}, ${platform})`,
                );
              }
              owners.set(name, platform);
              assets.push(join(directory, name));
            }
            for (const pattern of policy.required) {
              const matches = names.filter((name) => pattern.test(name));
              if (matches.length !== 1) {
                throw new Error(
                  `${platform} must provide exactly one ${pattern}; found ${matches.length}`,
                );
              }
            }
            const evidenceNames = names.filter((name) =>
              /^release-evidence-(?:macos|windows|linux)\.json$/.test(name),
            );
            if (
              evidenceNames.length !== 1 ||
              evidenceNames[0] !== policy.evidence
            ) {
              throw new Error(
                `${platform} must provide only ${policy.evidence} as release evidence`,
              );
            }
            let evidence;
            try {
              evidence = JSON.parse(
                readFileSync(join(directory, policy.evidence), 'utf8'),
              );
            } catch {
              throw new Error(`${platform} release evidence is invalid JSON`);
            }
            const expectedTag = `v${process.env.AGISTACK_RELEASE_VERSION}`;
            const expectedRunUrl =
              `https://github.com/${process.env.GITHUB_REPOSITORY}` +
              `/actions/runs/${process.env.GITHUB_RUN_ID}`;
            if (
              !isRecord(evidence) ||
              evidence.contract_version !== 'desktop-release-evidence-v1' ||
              evidence.verification_status !== 'verified_by_tag_ci' ||
              evidence.platform !== platform ||
              evidence.version !== process.env.AGISTACK_RELEASE_VERSION ||
              evidence.tag !== expectedTag ||
              evidence.tag !== process.env.GITHUB_REF_NAME ||
              evidence.commit_sha !== process.env.GITHUB_SHA ||
              !isRecord(evidence.workflow_run) ||
              evidence.workflow_run.id !== process.env.GITHUB_RUN_ID ||
              evidence.workflow_run.attempt !== process.env.GITHUB_RUN_ATTEMPT ||
              evidence.workflow_run.url !== expectedRunUrl
            ) {
              throw new Error(`${platform} release evidence CI identity does not match`);
            }
            if (!Array.isArray(evidence.assets)) {
              throw new Error(`${platform} release evidence assets must be an array`);
            }
            const publishableNames = names.filter((name) => name !== policy.evidence);
            const claimedAssets = new Map();
            for (const asset of evidence.assets) {
              if (
                !isRecord(asset) ||
                typeof asset.name !== 'string' ||
                basename(asset.name) !== asset.name ||
                !Number.isSafeInteger(asset.size) ||
                asset.size <= 0 ||
                !/^[A-Za-z0-9+/]{86}==$/.test(asset.sha512 ?? '') ||
                claimedAssets.has(asset.name)
              ) {
                throw new Error(`${platform} release evidence asset is invalid`);
              }
              claimedAssets.set(asset.name, asset);
            }
            if (
              claimedAssets.size !== publishableNames.length ||
              publishableNames.some((name) => !claimedAssets.has(name))
            ) {
              throw new Error(`${platform} release evidence asset set does not match`);
            }
            for (const name of publishableNames) {
              const path = join(directory, name);
              const claimed = claimedAssets.get(name);
              if (
                statSync(path).size !== claimed.size ||
                sha512(path) !== claimed.sha512
              ) {
                throw new Error(`${platform} release evidence digest mismatch: ${name}`);
              }
            }
            validateNativeEvidence(platform, evidence.native_verification);
          }
          const expectedNames = [...owners.keys()].sort();
          writeFileSync('verified-assets.txt', `${expectedNames.join('\n')}\n`);
          writeFileSync('verified-asset-paths.txt', `${assets.sort().join('\n')}\n`);
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_SHA1: ${{ secrets.WIN_CSC_SHA1 }}

      - name: Create or recover the verified draft release
        shell: bash
        run: |
          set -euo pipefail
          resolved_tag_commit="$(
            gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_REF_NAME}" --jq '.sha'
          )"
          if [[ "$resolved_tag_commit" != "$GITHUB_SHA" ]]; then
            echo "Tag $GITHUB_REF_NAME resolves to $resolved_tag_commit, not $GITHUB_SHA" >&2
            exit 1
          fi

          if release_json="$(
            gh release view "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --json isDraft,tagName 2>/dev/null
          )"; then
            is_draft="$(jq -r '.isDraft' <<<"$release_json")"
            release_tag="$(jq -r '.tagName' <<<"$release_json")"
            if [[ "$is_draft" != "true" || "$release_tag" != "$GITHUB_REF_NAME" ]]; then
              echo "Existing release must remain a draft for the exact tag" >&2
              exit 1
            fi
          else
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --verify-tag \
              --generate-notes \
              --title "agi-stack Desktop $GITHUB_REF_NAME"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Restore the verified draft assets
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t expected_assets < verified-assets.txt
          mapfile -t asset_paths < verified-asset-paths.txt
          mapfile -t existing_assets < <(
            gh release view "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --json assets \
              --jq '.assets[].name' | sort
          )

          for existing in "${existing_assets[@]}"; do
            if ! printf '%s\n' "${expected_assets[@]}" | grep -Fqx -- "$existing"; then
              echo "Refusing to overwrite draft with unexpected existing asset: $existing" >&2
              exit 1
            fi
          done
          gh release upload "$GITHUB_REF_NAME" "${asset_paths[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Verify the exact remote asset set
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --json assets \
            --jq '.assets[].name' | sort > remote-assets.txt
          if [[ "$(wc -l < remote-assets.txt | tr -d ' ')" != \
                "$(wc -l < verified-assets.txt | tr -d ' ')" ]] || \
             ! cmp -s verified-assets.txt remote-assets.txt; then
            echo "Remote release assets do not exactly match the verified local set" >&2
            diff -u verified-assets.txt remote-assets.txt || true
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Promote the verified draft release
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
