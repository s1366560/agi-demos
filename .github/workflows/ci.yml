        working-directory: web

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Set up Python
        id: setup-python
        continue-on-error: true
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.13'

      - name: Install uv
        uses: astral-sh/setup-uv@162b8acf397cb069dec09a3f5a9847cf71cfa46a # v1.0.7
        with:
          enable-cache: true

      - name: Retry Python install when the toolcache download fails
        if: steps.setup-python.outcome != 'success'
        working-directory: .
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if uv python install 3.12.13; then
              exit 0
            fi
            sleep $((attempt * 8))
          done
          exit 1

      - name: Install Python test dependencies
        working-directory: .
        run: uv sync --extra dev --frozen

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install desktop renderer dependencies
        working-directory: .
        run: pnpm --dir agi-stack/apps/desktop install --frozen-lockfile --ignore-scripts

      - name: Typecheck
        run: pnpm run type-check

      - name: Run unit tests
        run: pnpm run test

      - name: Build production bundle
        run: pnpm run build

  agi-stack-strangler-gate:
    name: agi-stack Strangler Gate
    needs: changes
    if: needs.changes.outputs.agi == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: agi-stack
    env:
      DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/memstack
      REDIS_URL: redis://localhost:6379
      LLM_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef # gitleaks:allow -- isolated CI fixture

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: memstack
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            agi-stack/target
          key: cargo-strangler-${{ runner.os }}-${{ hashFiles('agi-stack/Cargo.lock') }}
          restore-keys: cargo-strangler-${{ runner.os }}-

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add rustfmt clippy
          rustup target add wasm32-unknown-unknown

      - name: Set up Python for cloud contract validation
        id: setup-python
        continue-on-error: true
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.13'

      - name: Set up uv
        uses: astral-sh/setup-uv@162b8acf397cb069dec09a3f5a9847cf71cfa46a # v1.0.7
        with:
          enable-cache: true

      - name: Retry Python install when the toolcache download fails
        if: steps.setup-python.outcome != 'success'
        working-directory: .
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if uv python install 3.12.13; then
              exit 0
            fi
            sleep $((attempt * 8))
          done
          exit 1

      - name: Install cloud contract Python dependencies
        working-directory: .
        run: uv sync --frozen --no-dev

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Set up Node for Electron bridge validation
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: agi-stack/apps/desktop/pnpm-lock.yaml

      - name: Install Electron bridge contract dependencies
        run: pnpm --dir apps/desktop install --frozen-lockfile --ignore-scripts

      - name: Validate native catalog against Python cloud admission
        run: cargo test -p agistack-adapters-cua --test cloud_catalog --test cloud_permission_bridge

      - name: Install desktop native libraries
        run: |
          bash "$GITHUB_WORKSPACE/scripts/ci/use_ubuntu_archive_mirror.sh"
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-good libxkbcommon-dev pkg-config

      - name: Run strangler gate
        run: PKG_CONFIG_PATH="/usr/lib/x86_64-linux-gnu/pkgconfig:/usr/share/pkgconfig:${PKG_CONFIG_PATH:-}" make strangler-gate

  agi-stack-bench:
    name: agi-stack Bench Scorecard
    needs: changes
    if: needs.changes.outputs.agi == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: agi-stack

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Restore previous approved bench scorecard
        id: bench-baseline-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: agi-stack/target/bench/baseline
          key: agi-stack-bench-scorecard-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            agi-stack-bench-scorecard-${{ github.ref_name }}-

      - name: Select restored bench baseline
        run: |
          mkdir -p target/bench/baseline
          if [ -s target/bench/baseline/scorecard.json ]; then
            echo "BENCH_BASELINE=target/bench/baseline/scorecard.json" >> "$GITHUB_ENV"
            echo "Using restored bench baseline: target/bench/baseline/scorecard.json"
          else
            echo "BENCH_BASELINE=" >> "$GITHUB_ENV"
            echo "No previous approved bench baseline restored"
          fi

      - name: Run go/no-go bench scorecard
        run: |
          set +e
          make bench
          set -e
          python3 - << 'PY'
          import json
          import sys
          from pathlib import Path
          report_path = Path("target/bench/scorecard.json")
          if not report_path.is_file():
              sys.exit(2)
          report = json.loads(report_path.read_text())
          sys.exit(0 if report["summary"]["fail"] == 0 else 2)
          PY

      - name: Publish bench trend summary
        if: always()
        run: |
          if [ -f target/bench/scorecard.json ]; then
            if [ -n "${BENCH_BASELINE:-}" ]; then
              python3 scripts/bench-trend-summary.py target/bench/scorecard.json --baseline "$BENCH_BASELINE"
            else
              python3 scripts/bench-trend-summary.py target/bench/scorecard.json
            fi
          else
            {
              echo "## agi-stack Bench Scorecard"
              echo ""
              echo "Bench did not produce target/bench/scorecard.json."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Stage approved bench scorecard baseline
        if: success()
        run: |
          mkdir -p target/bench/baseline
          cp target/bench/scorecard.json target/bench/baseline/scorecard.json

      - name: Save approved bench scorecard baseline
        if: success()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: agi-stack/target/bench/baseline
          key: agi-stack-bench-scorecard-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload bench scorecard report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agi-stack-bench-scorecard
          path: agi-stack/target/bench/scorecard.json
          if-no-files-found: error

  agi-stack-desktop-bundle:
    name: agi-stack Desktop Bundle
    needs: changes
    if: needs.changes.outputs.agi == 'true'
    runs-on: macos-latest
    timeout-minutes: 70
    env:
      # Sidecar tests require cfg(debug_assertions); a release test profile
      # rejects the local knowledge host. Keep the debug test build and only
      # drop debuginfo. cargo test uses the test profile, so DEV_DEBUG alone
      # left the 7m30s test rebuild as "unoptimized + debuginfo" on run
      # 42957928259.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
    defaults:
      run:
        working-directory: agi-stack

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        id: setup-python
        continue-on-error: true
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@162b8acf397cb069dec09a3f5a9847cf71cfa46a # v1.0.7
        with:
          enable-cache: true

      - name: Retry Python install when the toolcache download fails
        if: steps.setup-python.outcome != 'success'
        working-directory: .
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if uv python install 3.12; then
              exit 0
            fi
            sleep $((attempt * 8))
          done
          exit 1

      - name: Install repository Python for desktop contract fixtures
        working-directory: .
        run: uv sync --frozen --no-dev --python 3.12

      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            agi-stack/target
            .cache/avernet-bcs
          key: cargo-desktop-${{ runner.os }}-${{ hashFiles('agi-stack/Cargo.lock', 'third_party/avernet-bcs/Cargo.lock') }}
          restore-keys: cargo-desktop-${{ runner.os }}-

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add rustfmt clippy

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: agi-stack/apps/desktop/pnpm-lock.yaml

      - name: Install desktop dependencies
        run: make desktop-deps

      - name: Install web packages used by desktop component tests
        working-directory: web
        run: corepack pnpm install --frozen-lockfile

      - name: Install Playwright Chromium for desktop browser tests
        working-directory: agi-stack/apps/desktop
        run: corepack pnpm exec playwright install chromium

      - name: Materialize repository database URL for desktop Python fixtures
        working-directory: .
        run: printf 'DATABASE_URL=%s\n' 'postgresql+asyncpg://postgres:testpassword@127.0.0.1:5432/memstack' > .env

      - name: Run desktop unit and integration tests
        run: |
          set -euo pipefail
          # Installer compilation stays out of this gate. Signed packages are
          # built by the protected tag workflow, and the unsigned local bundle
          # is the manual desktop-bundle-verify workflow.
          make desktop-test

      - name: Verify desktop icons and macOS entitlement resources
        run: make desktop-icons

      - name: Typecheck and compile the Electron application
        run: make desktop-electron-build

  agi-stack-android-artifact:
    name: agi-stack Android Artifact
    needs: changes
    if: needs.changes.outputs.agi == 'true'
