      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3.2.2
        with:
          packages: platform-tools

      - name: Install Android NDK
        run: sdkmanager "ndk;30.0.14904198"

      - name: Build Android mobile library
        run: make android NDK="$ANDROID_HOME/ndk/30.0.14904198" NDK_HOST_TAG=linux-x86_64

      - name: Upload Android mobile artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agi-stack-android-mobile
          path: |
            agi-stack/target/aarch64-linux-android/release/libagistack_mobile.so
            agi-stack/target/kotlin/**
          if-no-files-found: error

  agi-stack-ios-artifact:
    name: agi-stack iOS Artifact
    needs: changes
    if: needs.changes.outputs.agi == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: agi-stack

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Build iOS mobile library
        run: make ios

      - name: Upload iOS mobile artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: agi-stack-ios-mobile
          path: |
            agi-stack/target/AgistackMobile.xcframework/**
            agi-stack/target/uniffi-swift/**
            agi-stack/target/ios-headers/**
          if-no-files-found: error

