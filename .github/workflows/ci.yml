name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Path filter
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
      agi: ${{ steps.filter.outputs.agi }}
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Classify changed paths
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python3 scripts/ci_path_filter.py

  test:
    name: Backend Tests
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      UV_DEFAULT_INDEX: https://mirrors.aliyun.com/pypi/simple
    
    services:
      neo4j:
        image: neo4j:5.26
        env:
          NEO4J_AUTH: neo4j/testpassword
          NEO4J_PLUGINS: '["apoc"]'
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "cypher-shell -u neo4j -p testpassword 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: memstack
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      
      - name: Set up Python
        id: setup-python
        continue-on-error: true
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.13'
      
      - name: Install uv
        uses: astral-sh/setup-uv@162b8acf397cb069dec09a3f5a9847cf71cfa46a # v1.0.7
        with:
          enable-cache: true

      - name: Retry Python install when the toolcache download fails
        if: steps.setup-python.outcome != 'success'
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if uv python install 3.12.13; then
              exit 0
            fi
            sleep $((attempt * 8))
          done
          exit 1

      - name: Install dependencies
        run: |
          uv sync --extra dev --extra neo4j

      - name: Configure repository test database
        env:
          DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/memstack
        run: |
          printf 'DATABASE_URL=%s\n' "$DATABASE_URL" > .env

      - name: Guard wrapped ORM select execute usage
        run: |
          uv run python scripts/check_refresh_select_execute.py

      - name: Validate protocol-v2 plugin contracts
        run: make plugin-v2-contract-gate
      
      - name: Run linters
        run: |
          uv run ruff check src/ sdk/
          uv run mypy src/ --ignore-missing-imports
      
      - name: Plugin storage and review Postgres
        env:
          PLUGIN_STORAGE_POSTGRES_URL: postgresql+psycopg2://postgres:testpassword@localhost:5432/memstack
        run: uv run pytest src/tests/integration/test_plugin_storage_postgres.py -q

  unit:
    name: Backend unit (${{ matrix.shard }})
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    # Longest successful unit job on run 42876598409 was adapters-b, 12.1
    # minutes. plugins-g was cancelled at this 60 minute cap on 42769476886,
    # 42774866782, 42782329724, 42789007022, 42796068831, 42839522141,
    # 42852169680, 42864773566, and 42876598409: the pytest pipeline did not
    # return after the 18 minute kill. 30 minutes still covers the measured
    # 12 minute jobs and that 18 minute limit.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [plugins-a, plugins-b, plugins-c, plugins-d, plugins-e, plugins-f, plugins-g, plugins-h, plugins-i, plugins-j, plugins-k, plugins-l, plugins-m, plugins-n, plugins-o, plugins-p, adapters-a, adapters-b, agent, rest-a, rest-b, rest-c, rest-d]
    env:
      UV_DEFAULT_INDEX: https://mirrors.aliyun.com/pypi/simple
      PYTHONUNBUFFERED: "1"
      COVERAGE_CORE: sysmon
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: testpassword
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: memstack
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: testpassword
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      LLM_PROVIDER: gemini
    services:
      neo4j:
        image: neo4j:5.26
        env:
          NEO4J_AUTH: neo4j/testpassword
          NEO4J_PLUGINS: '["apoc"]'
        ports:
          - 7687:7687
          - 7474:7474
        options: >-
          --health-cmd "cypher-shell -u neo4j -p testpassword 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: memstack
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        id: setup-python
        continue-on-error: true
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.13'

      - name: Install uv
        uses: astral-sh/setup-uv@162b8acf397cb069dec09a3f5a9847cf71cfa46a # v1.0.7
        with:
          enable-cache: true

      - name: Retry Python install when the toolcache download fails
        if: steps.setup-python.outcome != 'success'
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            if uv python install 3.12.13; then
              exit 0
            fi
            sleep $((attempt * 8))
          done
          exit 1

      - name: Install dependencies
        run: uv sync --extra dev --extra neo4j

      - name: Install TypeScript for the contract scanner
        run: |
          set -euo pipefail
          target=web/node_modules/typescript/lib/typescript.js
          if [ -f "$target" ]; then
            exit 0
          fi
          npm install --no-package-lock --prefix /tmp/memstack-ts typescript@5.9.3
          mkdir -p web/node_modules
          ln -s /tmp/memstack-ts/node_modules/typescript web/node_modules/typescript

      - name: Configure repository test database
        env:
          DATABASE_URL: postgresql://postgres:testpassword@localhost:5432/memstack
        run: printf 'DATABASE_URL=%s\n' "$DATABASE_URL" > .env

      - name: Record plugins-g shard boundary
        if: matrix.shard == 'plugins-g'
        run: bash scripts/ci/plugins_g_shard_prelude.sh shard-prelude/summary.txt

      - name: Upload plugins-g shard boundary
        if: matrix.shard == 'plugins-g'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: plugins-g-shard-boundary
          path: shard-prelude/summary.txt
          if-no-files-found: error

      - name: Run unit shard
        if: matrix.shard != 'plugins-g'
        timeout-minutes: 20
        run: |
          set -euo pipefail
          # Interleave files so one directory's slow cases do not land in one shard.
          # Local --durations: adapters 11m, plugins 12m, agent 2m. Rest was still
          # in the router files at 70% after 23m, so it is cut four ways.
          shard_files() {
            local part="$1" parts="$2"
            shift 2
            local files=("$@")
            args=()
            local i
            for i in "${!files[@]}"; do
              if (( i % parts == part )); then
                args+=("${files[$i]}")
              fi
            done
            if ((${#args[@]} == 0)); then
              echo "shard ${part}/${parts} collected no tests" >&2
              exit 1
            fi
          }
          case "${{ matrix.shard }}" in
            plugins-a|plugins-b|plugins-c|plugins-d|plugins-e|plugins-f|plugins-g|plugins-h|plugins-i|plugins-j|plugins-k|plugins-l|plugins-m|plugins-n|plugins-o|plugins-p)
              mapfile -t files < <(find src/tests/unit/infrastructure/plugins -name 'test_*.py' | sort)
              ;;
            adapters-a|adapters-b)
              mapfile -t files < <(find src/tests/unit/infrastructure/adapters -name 'test_*.py' | sort)
              ;;
            agent)
              args=(src/tests/unit/infrastructure/agent)
              ;;
            rest-a|rest-b|rest-c|rest-d)
              mapfile -t files < <(find src/tests/unit -name 'test_*.py' \
                -not -path '*/infrastructure/plugins/*' \
                -not -path '*/infrastructure/adapters/*' \
                -not -path '*/infrastructure/agent/*' | sort)
              ;;
          esac
          case "${{ matrix.shard }}" in
            plugins-a) shard_files 0 16 "${files[@]}" ;;
            plugins-b) shard_files 1 16 "${files[@]}" ;;
            plugins-c) shard_files 2 16 "${files[@]}" ;;
            plugins-d) shard_files 3 16 "${files[@]}" ;;
            plugins-e) shard_files 4 16 "${files[@]}" ;;
            plugins-f) shard_files 5 16 "${files[@]}" ;;
            plugins-g) shard_files 6 16 "${files[@]}" ;;
            plugins-h) shard_files 7 16 "${files[@]}" ;;
            plugins-i) shard_files 8 16 "${files[@]}" ;;
            plugins-j) shard_files 9 16 "${files[@]}" ;;
            plugins-k) shard_files 10 16 "${files[@]}" ;;
            plugins-l) shard_files 11 16 "${files[@]}" ;;
            plugins-m) shard_files 12 16 "${files[@]}" ;;
            plugins-n) shard_files 13 16 "${files[@]}" ;;
            plugins-o) shard_files 14 16 "${files[@]}" ;;
            plugins-p) shard_files 15 16 "${files[@]}" ;;
            adapters-a) shard_files 0 2 "${files[@]}" ;;
            adapters-b) shard_files 1 2 "${files[@]}" ;;
            rest-a) shard_files 0 4 "${files[@]}" ;;
            rest-b) shard_files 1 4 "${files[@]}" ;;
            rest-c) shard_files 2 4 "${files[@]}" ;;
            rest-d) shard_files 3 4 "${files[@]}" ;;
          esac
          mkdir -p shard-logs
          pytest_log="shard-logs/${{ matrix.shard }}-pytest.log"
          # GNU timeout puts pytest in a new process group, so the runner cannot
          # reap it (job 130340536360). plugins-g is not this step: each of its
          # files is a later step whose name stays visible if that file hangs.
          run_pytest() {
            local method="$1"
            shift
            COVERAGE_FILE="coverage-${{ matrix.shard }}" \
              PYTHONFAULTHANDLER=1 \
              PYTHONUNBUFFERED=1 \
              uv run pytest "${args[@]}" \
                -m "not integration" \
                --timeout=120 \
                --timeout-method="$method" \
                --durations=20 \
                --cov=src \
                --cov-report= \
                --cov-fail-under=0 \
                "$@" \
                > "$pytest_log" 2>&1
          }
          echo "shard ${{ matrix.shard }} pytest start $(date -u +%H:%M:%S)"
          set +e
          run_pytest signal
          status=$?
          set -e
          echo "----- ${{ matrix.shard }} pytest status ${status} -----"
          echo "----- ${{ matrix.shard }} pytest log tail -----"
          tail -n 200 "$pytest_log" || true
          exit "$status"

      - name: plugins-g collect
        if: matrix.shard == 'plugins-g'
        timeout-minutes: 5
        run: bash scripts/ci/plugins_g_collect.sh

      - name: Upload plugins-g collected tests
        if: always() && matrix.shard == 'plugins-g'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: plugins-g-collected
          path: shard-logs/plugins-g-collected.txt
          if-no-files-found: warn

      - name: plugins-g test test_package_registry.py
        if: matrix.shard == 'plugins-g'
        timeout-minutes: 8
        run: bash scripts/ci/plugins_g_file_step.sh src/tests/unit/infrastructure/plugins/test_package_registry.py

      - name: Upload plugins-g test_package_registry.py
        if: always() && matrix.shard == 'plugins-g'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: plugins-g-test_package_registry
          path: |
            shard-logs/test_package_registry.log
            shard-logs/test_package_registry.status
          if-no-files-found: warn

      - name: plugins-g test test_agent_di_facade_retirement_v2.py
        if: matrix.shard == 'plugins-g'
        timeout-minutes: 8
        run: bash scripts/ci/plugins_g_file_step.sh src/tests/unit/infrastructure/plugins/v2/test_agent_di_facade_retirement_v2.py

      - name: Upload plugins-g test_agent_di_facade_retirement_v2.py
        if: always() && matrix.shard == 'plugins-g'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
