# Fixed Cloud QA contribution. Native acceptance and product release stay separate.
schema_version: 2
profile:
  id: memstack-cloud-knowledge-sync-acceptance-v2
  entries:
    - entry_id: builtin-cloud-knowledge-sync-repository
      parent_entry_id: runtime-generation-boundary
      plugin_ref: memstack-runtime-kernel
      module_ref: builtin://memstack/persistence/cloud-knowledge-sync
      enabled: true
      config:
        strategy: request-async-session
      inject: {}
      isolate: {}
      scope:
        kind: root
      permissions: []
      quotas: {}
      restart_policy: hot-generation
    - entry_id: builtin-cloud-knowledge-sync-application
      parent_entry_id: runtime-generation-boundary
      plugin_ref: memstack-runtime-kernel
      module_ref: builtin://memstack/application/cloud-knowledge-sync
      enabled: true
      config:
        strategy: operation-scoped-provider
      inject:
        repositories: service:persistence.cloud-knowledge-sync
      isolate: {}
      scope:
        kind: root
      permissions: []
      quotas: {}
      restart_policy: hot-generation
    - entry_id: builtin-cloud-knowledge-sync-http-routes
      parent_entry_id: runtime-generation-boundary
      plugin_ref: memstack-runtime-kernel
      module_ref: builtin://memstack/http/cloud-knowledge-sync-routes
      enabled: true
      config: {}
      inject:
        route_table: service:http.route-table-builder
        application: service:application.cloud-knowledge-sync
      isolate: {}
      scope:
        kind: root
      permissions: []
      quotas: {}
      restart_policy: hot-generation
