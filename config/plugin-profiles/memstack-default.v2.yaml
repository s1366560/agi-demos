      parent_entry_id: runtime-generation-boundary
      plugin_ref: memstack-runtime-kernel
      module_ref: builtin://memstack/http/legacy-route-bridge
      enabled: true
      config:
        routes: []
      inject:
        route_table: service:http.route-table-builder
      isolate: {}
      scope:
        kind: root
      permissions: []
      quotas: {}
      restart_policy: hot-generation
    - entry_id: builtin-agent-loop
      parent_entry_id: runtime-generation-boundary
      plugin_ref: memstack-runtime-kernel
      module_ref: builtin://memstack/agent/loop
      enabled: true
      config:
        loop_id: builtin-react
      inject: {}
      isolate: {}
      scope:
        kind: root
      permissions: []
      quotas: {}
      restart_policy: hot-generation
    - entry_id: builtin-system-prompt
      parent_entry_id: runtime-generation-boundary
      plugin_ref: memstack-runtime-kernel
      module_ref: builtin://memstack/agent/system-prompt
      enabled: true
      config:
        runtime_sections:
          - >-
            When a tool is needed, use the runtime's native tool-call protocol and only
            the tools declared for the current step. Never print textual tool-call markup
            such as [TOOL_CALL]...[/TOOL_CALL], JSON/function-call stubs, or shell command
            code blocks as a substitute for calling a tool. Also never print
            <minimax:tool_call> or <invoke name=...> markup.
        strategy: system-prompt-manager
      inject: {}
      isolate: {}
      scope:
        kind: root
      permissions: []
      quotas: {}
      restart_policy: hot-generation
    - entry_id: builtin-tool-set
      parent_entry_id: runtime-generation-boundary
      plugin_ref: memstack-runtime-kernel
