[project]
name = "memstack-plugin-sdk"
version = "0.1.0"
description = "Build signed MemStack plugin packages and validate their contributions."
requires-python = ">=3.12"
dependencies = ["cryptography>=42", "httpx>=0.27,<1", "rfc8785>=0.1"]

[project.scripts]
memstack-plugin-pack = "memstack_plugin_sdk.pack:main"
memstack-plugin-publish = "memstack_plugin_sdk.publish:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
